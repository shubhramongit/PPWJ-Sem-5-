<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .square{
            height: 100px;
            width: 10px;
            background-attachment: aquamarine;

        }
    </style>
    <script>
        function toggleClass(){
            let d1=document.getElementById("shape")
            d1.classList.toggle("hide")
        }
    </script>
    <div id="shape" class="square"></div>
    <button onClick="toggleClass">Toggle Class</button>
</body>
</html>
